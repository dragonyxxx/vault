<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultPro Dashboard - Final Match</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; max-width: 800px; margin: auto; padding: 20px; }
        .card { background: #1e293b; padding: 20px; margin-top: 20px; border-radius: 12px; border: 1px solid #334155; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; background: #2563eb; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }
        input { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #334155; background: #0f172a; color: white; border-radius: 8px; box-sizing: border-box; }
        table { width: 100%; margin-top: 15px; border-collapse: collapse; }
        td, th { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
        .status-msg { margin-top: 10px; font-size: 0.9em; color: #94a3b8; }
    </style>
</head>
<body>

    <h2>VaultPro Dashboard V5 (Final)</h2>

    <div class="card">
        <label>Vault Address</label>
        <input id="vaultAddress" placeholder="0x..." value="0x93C7d56BB62fFE993135f86C4BdD69c41D302b46">
        <button id="connectBtn">Hubungkan Wallet</button>
        <div id="walletStatus" class="status-msg">Status: Belum Terhubung</div>
    </div>

    <div class="card">
        <h3>Informasi Vault</h3>
        <div>Unlock Time: <span id="unlock">-</span></div>
        <div>Emergency Status: <span id="emergency">-</span></div>
        <div>BNB Balance: <span id="bnb">0</span></div>
    </div>

    <div class="card">
        <h3>Track Token Baru</h3>
        <input id="tokenAddress" placeholder="Alamat Token (USDT: 0x55d3...)">
        <button id="trackTokenBtn" style="background:#0ea5e9">Track Token</button>
    </div>

    <div class="card">
        <h3>Daftar Token & Saldo</h3>
        <table>
            <thead><tr><th>Token</th><th>Saldo</th></tr></thead>
            <tbody id="tokenTable"></tbody>
        </table>
        <button onclick="loadTokens()" style="background:#475569; font-size: 12px; width: auto; padding: 5px 15px;">Refresh Saldo</button>
    </div>

<script>
let provider, signer, vault, userAddress;

// ABI ini sudah disesuaikan persis dengan kontrak Solidity Anda
const vaultAbi = [
    "function owner() view returns(address)",
    "function unlockTime() view returns(uint256)",
    "function emergencyRequested() view returns(bool)",
    "function emergencyWithdrawRequestTime() view returns(uint256)",
    "function trackedTokens(uint256) view returns(address)", // Cara akses array public
    "function trackToken(address token)",
    "function requestEmergency()",
    "function cancelEmergency()",
    "function executeEmergency(address[] tokens)"
];

const erc20Abi = [
    "function balanceOf(address) view returns(uint256)",
    "function decimals() view returns(uint8)",
    "function symbol() view returns(string)"
];

async function connectWallet() {
    if (typeof window.ethers === 'undefined') return alert("Ethers.js tidak terdeteksi");
    const injected = window.ethereum || window.BinanceChain;
    if (!injected) return alert("Gunakan Binance/MetaMask browser");

    await injected.request({ method: "eth_requestAccounts" });
    provider = new window.ethers.BrowserProvider(injected);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();
    document.getElementById("walletStatus").innerText = "Connected: " + userAddress;
    
    initVault();
}

async function initVault() {
    const addr = document.getElementById("vaultAddress").value.trim();
    vault = new window.ethers.Contract(addr, vaultAbi, signer);
    
    // Load data dasar
    const [unlock, emergency, bnbBal] = await Promise.all([
        vault.unlockTime(),
        vault.emergencyRequested(),
        provider.getBalance(addr)
    ]);

    document.getElementById("unlock").innerText = new Date(Number(unlock) * 1000).toLocaleString();
    document.getElementById("emergency").innerText = emergency ? "AKTIF" : "Tidak Aktif";
    document.getElementById("bnb").innerText = window.ethers.formatEther(bnbBal) + " BNB";

    loadTokens();
}

async function loadTokens() {
    const table = document.getElementById("tokenTable");
    table.innerHTML = "<tr><td colspan='2'>Mencari token...</td></tr>";
    
    let tokens = [];
    let i = 0;
    let endOfArray = false;

    // Karena kontrak Anda tidak punya fungsi length, kita loop sampai error (habis)
    while (!endOfArray) {
        try {
            const tokenAddr = await vault.trackedTokens(i);
            tokens.push(tokenAddr);
            i++;
        } catch (e) {
            endOfArray = true; // Array sudah habis
        }
    }

    if (tokens.length === 0) {
        table.innerHTML = "<tr><td colspan='2'>Belum ada token terdaftar.</td></tr>";
        return;
    }

    table.innerHTML = "";
    const vaultAddr = await vault.getAddress();

    for (const addr of tokens) {
        try {
            const tContract = new window.ethers.Contract(addr, erc20Abi, provider);
            const [sym, dec, bal] = await Promise.all([
                tContract.symbol().catch(() => "TOKEN"),
                tContract.decimals().catch(() => 18),
                tContract.balanceOf(vaultAddr)
            ]);
            table.innerHTML += `<tr><td>${sym}<br><small>${addr}</small></td><td>${window.ethers.formatUnits(bal, dec)}</td></tr>`;
        } catch (err) {
            console.error(err);
        }
    }
}

document.getElementById("connectBtn").onclick = connectWallet;

document.getElementById("trackTokenBtn").onclick = async () => {
    const addr = document.getElementById("tokenAddress").value;
    if (!window.ethers.isAddress(addr)) return alert("Alamat salah");
    try {
        const tx = await vault.trackToken(addr);
        alert("Transaksi dikirim, tunggu konfirmasi...");
        await tx.wait();
        alert("Berhasil track token!");
        loadTokens();
    } catch (e) {
        alert("Error: " + e.message);
    }
};
</script>
</body>
</html>
