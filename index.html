<div class="card" style="display: flex; gap: 10px; background: #334155;">
    <button onclick="exportData()" style="background: #059669; font-size: 13px;">💾 Backup Data (Unduh)</button>
    <button onclick="document.getElementById('importFile').click()" style="background: #7c3aed; font-size: 13px;">📂 Restore Data (Upload)</button>
    <input type="file" id="importFile" style="display:none" onchange="importData(event)">
</div>

<script>
// ... (Gunakan variabel portfolioMeta dari kode sebelumnya) ...

/**
 * FITUR BACKUP (DOWNLOAD FILE)
 */
function exportData() {
    const dataStr = JSON.stringify(portfolioMeta, null, 2);
    const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
    
    const exportFileDefaultName = 'vault_portfolio_backup_' + new Date().toISOString().slice(0,10) + '.json';
    
    const linkElement = document.createElement('a');
    linkElement.setAttribute('href', dataUri);
    linkElement.setAttribute('download', exportFileDefaultName);
    linkElement.click();
}

/**
 * FITUR RESTORE (UPLOAD FILE)
 */
function importData(event) {
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const importedData = JSON.parse(e.target.result);
            
            // Validasi sederhana
            if (typeof importedData === 'object') {
                portfolioMeta = importedData;
                localStorage.setItem('vault_dca_meta', JSON.stringify(portfolioMeta));
                alert("✅ Data berhasil dipulihkan! Dashboard akan memuat ulang.");
                location.reload();
            }
        } catch (err) {
            alert("❌ File tidak valid atau rusak.");
        }
    };
    reader.readAsText(event.target.files[0]);
}

/**
 * LOGIKA PENJUMLAHAN TOTAL (OPTIMASI)
 */
function updateTotals() {
    const rows = document.querySelectorAll("#tokenTable tr");
    let grandTotalCurrent = 0;
    let grandTotalInvested = 0;

    rows.forEach(row => {
        const symbol = row.cells[0].innerText.split("\n")[0];
        const amount = parseFloat(row.cells[1].innerText);
        const id = row.querySelector("button").getAttribute("onclick").split("'")[1];
        
        const meta = portfolioMeta[id] || { avg: 0 };
        let currPrice = (symbol === "BNB") ? prices.bnb : (symbol.includes("USD") ? prices.usdt : (symbol.includes("DOGE") ? prices.doge : 0));
        
        grandTotalCurrent += (amount * currPrice);
        grandTotalInvested += (amount * meta.avg);
    });

    document.getElementById("grandTotalUSD").innerText = "$" + grandTotalCurrent.toLocaleString(undefined, {minimumFractionDigits: 2});
    
    const plBox = document.getElementById("totalPL");
    const diff = grandTotalCurrent - grandTotalInvested;
    const percent = grandTotalInvested > 0 ? (diff / grandTotalInvested) * 100 : 0;
    
    plBox.className = diff >= 0 ? "profit" : "loss";
    plBox.innerText = `${diff >= 0 ? '+' : ''}$${diff.toFixed(2)} (${percent.toFixed(2)}%)`;
}
</script>
