<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VaultPro Dashboard</title>

<script src="ethers.min.js"></script>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
max-width:900px;
margin:auto;
padding:25px;
}

.card{
background:#1e293b;
padding:20px;
margin-top:20px;
border-radius:10px;
}

input{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:5px;
}

table{
width:100%;
margin-top:10px;
border-collapse:collapse;
}

td,th{
padding:8px;
border-bottom:1px solid #334155;
}

.status{
margin-top:10px;
font-weight:bold;
}

</style>
</head>

<body>

<h2>VaultPro Dashboard</h2>

<div class="card">

<label>Vault Address</label>
<input id="vaultAddress" value="0x93C7d56BB62FFE993135f86C4BdD69c41D302b46">

<div id="walletStatus" class="status">
Detecting wallet...
</div>

</div>


<div class="card">

<h3>Vault Info</h3>

<div>Owner: <span id="owner">-</span></div>
<div>Unlock Time: <span id="unlock">-</span></div>
<div>Emergency Requested: <span id="emergency">-</span></div>
<div>BNB Balance: <span id="bnb">0</span></div>

</div>

<script>

let provider
let signer
let vault
let userAddress

const vaultAbi=[

"function owner() view returns(address)",
"function unlockTime() view returns(uint256)",
"function emergencyRequested() view returns(bool)"

]


async function autoConnect(){

try{

let injectedProvider=null

// detect Binance wallet
if(window.BinanceChain){

injectedProvider=window.BinanceChain

}

// detect metamask
else if(window.ethereum){

injectedProvider=window.ethereum

}

else{

document.getElementById("walletStatus").innerHTML=
"Wallet tidak terdeteksi"

return

}

provider=new ethers.providers.Web3Provider(injectedProvider)

await injectedProvider.request({
method:"eth_requestAccounts"
})

signer=provider.getSigner()

userAddress=await signer.getAddress()

document.getElementById("walletStatus").innerHTML=
"Connected: "+userAddress

initVault()

}catch(e){

document.getElementById("walletStatus").innerHTML=e.message

}

}



async function initVault(){

const addr=document.getElementById("vaultAddress").value.trim()

vault=new ethers.Contract(addr,vaultAbi,signer)

loadVault()

}



async function loadVault(){

const owner=await vault.owner()

document.getElementById("owner").innerHTML=owner

const unlock=await vault.unlockTime()

document.getElementById("unlock").innerHTML=
new Date(unlock*1000).toLocaleString()

const emergency=await vault.emergencyRequested()

document.getElementById("emergency").innerHTML=emergency

const bnb=await provider.getBalance(vault.address)

document.getElementById("bnb").innerHTML=
ethers.utils.formatEther(bnb)

}


autoConnect()

</script>

</body>
</html>
