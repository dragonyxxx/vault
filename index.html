<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaultPro Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.8.3/dist/ethers.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
<style>
body { font-family: Arial, sans-serif; max-width: 700px; margin: 50px auto; }
input, button { padding: 10px; margin: 5px 0; width: 100%; }
label { font-weight: bold; margin-top: 15px; display: block; }
.status { margin-top: 10px; font-weight: bold; color: green; }
table { width: 100%; border-collapse: collapse; margin-top: 15px; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
th { background-color: #eee; }
</style>
</head>
<body>
<h2>VaultPro Emergency Dashboard</h2>

<label>Vault Contract Address:</label>
<input type="text" id="contractAddress" placeholder="0x93C7d56BB62fFE993135f86C4BdD69c41D302b46">

<label>Optional RPC URL (BSC, ETH etc.)</label>
<input type="text" id="rpcUrl" placeholder="https://bsc-dataseed.binance.org/">

<button id="connectMetaMaskBtn">Connect MetaMask</button>
<button id="connectWalletConnectBtn">Connect WalletConnect</button>
<div id="walletStatus" class="status"></div>

<hr>

<h3>Vault Info</h3>
<div id="vaultInfo">
    <div>Owner: <span id="vaultOwner">-</span></div>
    <div>Unlock Time: <span id="unlockTime">-</span></div>
    <div>Vault Locked Permanently: <span id="unlockLocked">-</span></div>
    <div>Emergency Requested: <span id="emergencyStatus">-</span></div>
    <div>Emergency Ready After: <span id="emergencyCountdown">-</span></div>
    <div>BNB Balance: <span id="bnbBalance">0</span></div>
    <div>Total Token Count: <span id="tokenCount">0</span></div>
    <div>Total Vault Balance (est.): <span id="totalValue">0</span></div>
</div>

<hr>

<h3>Track New Token</h3>
<input type="text" id="newTokenAddress" placeholder="0xTokenAddress">
<button id="trackNewTokenBtn">Track Token</button>

<hr>

<h3>Emergency Actions</h3>
<button id="requestEmergencyBtn">Request Emergency</button>
<button id="cancelEmergencyBtn">Cancel Emergency</button>

<label>Execute Emergency (JSON Array of token addresses, empty = BNB only)</label>
<input type="text" id="tokenArray" placeholder='["0xToken1","0xToken2"]'>
<button id="executeEmergencyBtn">Execute Emergency</button>
<button id="executeAllTokensBtn">Execute All Tokens + BNB</button>

<div id="txStatus" class="status"></div>

<h3>Tracked Tokens</h3>
<table id="tokenTable">
    <thead>
        <tr><th>Token Address</th><th>Balance</th></tr>
    </thead>
    <tbody></tbody>
</table>

<script>
let provider, signer, vault, wcProvider;

const vaultAbi = [
    "function requestEmergency() external",
    "function cancelEmergency() external",
    "function executeEmergency(address[] calldata tokens) external",
    "function trackToken(address token) external",
    "function emergencyRequested() view returns (bool)",
    "function emergencyWithdrawRequestTime() view returns (uint256)",
    "function owner() view returns (address)",
    "function trackedTokens(uint256) view returns (address)",
    "function trackedTokensLength() view returns (uint256)",
    "function unlockTime() view returns (uint256)",
    "function unlockTimeLocked() view returns (bool)"
];

const erc20Abi = [
    "function balanceOf(address account) view returns (uint256)",
    "function decimals() view returns (uint8)",
    "function symbol() view returns (string)"
];

// --- Connect MetaMask ---
document.getElementById("connectMetaMaskBtn").onclick = async () => {
    if (!window.ethereum) { alert("Install MetaMask"); return; }
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    document.getElementById("walletStatus").innerText = "MetaMask Connected: " + await signer.getAddress();
    initVault();
};

// --- Connect WalletConnect ---
document.getElementById("connectWalletConnectBtn").onclick = async () => {
    wcProvider = new WalletConnectProvider.default({
        rpc: { 56: "https://bsc-dataseed.binance.org/" },
        qrcode: true
    });
    await wcProvider.enable();
    provider = new ethers.BrowserProvider(wcProvider);
    signer = await provider.getSigner();
    document.getElementById("walletStatus").innerText = "WalletConnect Connected: " + await signer.getAddress();
    initVault();
};

// --- Initialize Vault ---
async function initVault() {
    const addr = document.getElementById("contractAddress").value.trim();
    if (!addr) { alert("Enter Vault Contract Address"); return; }
    vault = new ethers.Contract(addr, vaultAbi, signer);
    await loadVaultInfo();
}

// --- Load Vault Info ---
async function loadVaultInfo() {
    if (!vault) return;
    try {
        const owner = await vault.owner();
        const unlockTime = await vault.unlockTime();
        const unlockLocked = await vault.unlockTimeLocked();
        const emergencyRequested = await vault.emergencyRequested();
        const emergencyTime = await vault.emergencyWithdrawRequestTime();
        const now = Math.floor(Date.now()/1000);
        const countdown = emergencyRequested ? Math.max(0,(emergencyTime+60*24*3600)-now) : 0;

        document.getElementById("vaultOwner").innerText = owner;
        document.getElementById("unlockTime").innerText = new Date(unlockTime*1000).toLocaleString();
        document.getElementById("unlockLocked").innerText = unlockLocked;
        document.getElementById("emergencyStatus").innerText = emergencyRequested;
        document.getElementById("emergencyCountdown").innerText = countdown + " sec";

        // Tracked tokens
        const tokenCount = await vault.trackedTokensLength();
        document.getElementById("tokenCount").innerText = tokenCount;
        const tbody = document.getElementById("tokenTable").querySelector("tbody");
        tbody.innerHTML = "";

        let totalValueTokens = 0;
        const bnbBalance = parseFloat(ethers.formatEther(await provider.getBalance(vault.target)));

        for (let i=0;i<tokenCount;i++){
            const tokenAddr = await vault.trackedTokens(i);
            const token = new ethers.Contract(tokenAddr, erc20Abi, provider);
            let bal = await token.balanceOf(vault.target);
            let decimals = 18;
            try { decimals = await token.decimals(); } catch(e) {}
            let balanceDisplay = parseFloat(ethers.formatUnits(bal, decimals));
            tbody.innerHTML += `<tr><td>${tokenAddr}</td><td>${balanceDisplay}</td></tr>`;
            totalValueTokens += balanceDisplay;
        }

        document.getElementById("bnbBalance").innerText = bnbBalance;
        document.getElementById("totalValue").innerText = (bnbBalance + totalValueTokens).toFixed(4);

    } catch(err) {
        document.getElementById("txStatus").innerText = "Error loading vault info: " + err.message;
    }
}

// --- Send Transaction ---
async function sendTx(funcName, params=[]) {
    try {
        const tx = await vault[funcName](...params);
        document.getElementById("txStatus").innerText = "Tx sent: " + tx.hash;
        await tx.wait();
        document.getElementById("txStatus").innerText = "Tx confirmed ✅";
        await loadVaultInfo();
    } catch(err) {
        document.getElementById("txStatus").innerText = "Error: " + err.message;
    }
}

// --- Button Events ---
document.getElementById("requestEmergencyBtn").onclick = ()=>sendTx("requestEmergency");
document.getElementById("cancelEmergencyBtn").onclick = ()=>sendTx("cancelEmergency");
document.getElementById("executeEmergencyBtn").onclick = async ()=>{
    let tokens = [];
    const input = document.getElementById("tokenArray").value.trim();
    if(input) tokens = JSON.parse(input);
    await sendTx("executeEmergency",[tokens]);
};
document.getElementById("executeAllTokensBtn").onclick = async ()=>{
    const tokenCount = await vault.trackedTokensLength();
    const tokens = [];
    for(let i=0;i<tokenCount;i++){
        const t = await vault.trackedTokens(i);
        tokens.push(t);
    }
    await sendTx("executeEmergency",[tokens]);
};
document.getElementById("trackNewTokenBtn").onclick = async ()=>{
    const tokenAddr = document.getElementById("newTokenAddress").value.trim();
    if(!tokenAddr) { alert("Enter token address"); return; }
    await sendTx("trackToken",[tokenAddr]);
};

// Auto-refresh vault info setiap 10 detik
setInterval(()=>{ if(vault) loadVaultInfo(); }, 10000);
</script>
</body>
</html>
