<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Vault Advanced Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px
}

.card{
background:#1e293b;
padding:15px;
border-radius:10px;
margin-bottom:15px
}

button{
padding:8px;
margin:5px;
background:#2563eb;
color:white;
border:none;
border-radius:6px
}

.big{
font-size:22px;
font-weight:bold
}

.alert{
background:#dc2626;
padding:10px;
border-radius:6px;
margin-top:10px
}

</style>

</head>

<body>

<h1>Vault Dashboard</h1>

<div class="card">

<button onclick="connectWallet()">Connect Wallet</button>

<p id="wallet"></p>

</div>


<div class="card">

<h3>Vault Info</h3>

<p>Owner: <span id="owner"></span></p>
<p>Heir: <span id="heir"></span></p>
<p>Guardian: <span id="guardian"></span></p>

<div id="alert"></div>

</div>


<div class="card">

<h3>Portfolio Value</h3>

<p class="big">$<span id="portfolioValue">0</span></p>

<canvas id="chart"></canvas>

</div>


<div class="card">

<h3>Balances</h3>

<p>BNB: <span id="bnb"></span></p>

<ul id="tokenList"></ul>

</div>


<div class="card">

<h3>Detected Tokens</h3>

<div id="detected"></div>

</div>


<div class="card">

<h3>Guardian Dashboard</h3>

<button onclick="freezeVault()">Freeze Vault</button>
<button onclick="unfreezeVault()">Unfreeze Vault</button>

<input id="recoverOwner" placeholder="new owner">

<button onclick="recoverOwner()">Recover Owner</button>

</div>


<div class="card">

<h3>Inheritance Timer</h3>

<p id="inheritTimer"></p>

</div>


<div class="card">

<h3>Last 5 Transactions</h3>

<ul id="txHistory"></ul>

</div>



<script>

const contractAddress="PASTE_PROXY_ADDRESS_HERE"

const abi=[

"function owner() view returns(address)",
"function heir() view returns(address)",
"function guardian() view returns(address)",
"function lastActivity() view returns(uint256)",
"function inheritanceRequestTime() view returns(uint256)",

"function getTrackedTokens() view returns(address[])",
"function trackToken(address)",

"function freezeVault()",
"function unfreezeVault()",
"function recoverOwner(address)"

]

const erc20abi=[

"function symbol() view returns(string)",
"function balanceOf(address) view returns(uint256)",
"function decimals() view returns(uint8)"

]


let provider
let signer
let contract
let chart



async function connectWallet(){

provider=new ethers.BrowserProvider(window.ethereum)

await provider.send("eth_requestAccounts",[])

signer=await provider.getSigner()

contract=new ethers.Contract(contractAddress,abi,signer)

const addr=await signer.getAddress()

document.getElementById("wallet").innerText=addr

loadVault()

}



async function loadVault(){

const owner=await contract.owner()
const heir=await contract.heir()
const guardian=await contract.guardian()

document.getElementById("owner").innerText=owner
document.getElementById("heir").innerText=heir
document.getElementById("guardian").innerText=guardian

checkInactivity()

const bnb=await provider.getBalance(contractAddress)

document.getElementById("bnb").innerText=ethers.formatEther(bnb)

await loadTokens()

detectTokens()

loadInheritanceTimer()

loadTransactions()

}



async function checkInactivity(){

const last=await contract.lastActivity()

const now=Math.floor(Date.now()/1000)

const diff=now-last

const sixMonths=15552000

if(diff>sixMonths*0.8){

document.getElementById("alert").innerHTML=

"<div class='alert'>⚠ Owner inactivity approaching 6 months</div>"

}

}



async function loadTokens(){

const tokens=await contract.getTrackedTokens()

let totalUSD=0

const list=document.getElementById("tokenList")

list.innerHTML=""

for(let addr of tokens){

const token=new ethers.Contract(addr,erc20abi,provider)

let symbol="TOKEN"
let decimals=18

try{symbol=await token.symbol()}catch{}
try{decimals=await token.decimals()}catch{}

const bal=await token.balanceOf(contractAddress)

const amount=parseFloat(ethers.formatUnits(bal,decimals))

const price=await getTokenPrice(symbol)

const value=amount*price

totalUSD+=value

const li=document.createElement("li")

li.innerText=`${symbol} : ${amount} ($${value.toFixed(2)})`

list.appendChild(li)

}

document.getElementById("portfolioValue").innerText=totalUSD.toFixed(2)

updateChart(totalUSD)

}



async function getTokenPrice(symbol){

try{

const res=await fetch("https://api.coingecko.com/api/v3/simple/price?ids="+symbol.toLowerCase()+"&vs_currencies=usd")

const data=await res.json()

return Object.values(data)[0].usd

}catch{

return 0

}

}



async function detectTokens(){

const tracked=await contract.getTrackedTokens()

const trackedSet=new Set(tracked)

const res=await fetch(

"https://api.bscscan.com/api?module=account&action=tokentx&address="+contractAddress+"&sort=desc"

)

const data=await res.json()

const div=document.getElementById("detected")

div.innerHTML=""

const detected=new Set()

for(let tx of data.result){

detected.add(tx.contractAddress)

}

for(let token of detected){

if(!trackedSet.has(token)){

const el=document.createElement("div")

el.innerHTML=`

${token}

<button onclick="trackToken('${token}')">Track Token</button>

`

div.appendChild(el)

}

}

}



async function trackToken(addr){

const tx=await contract.trackToken(addr)

await tx.wait()

loadVault()

}



function updateChart(value){

const ctx=document.getElementById("chart")

if(!chart){

chart=new Chart(ctx,{
type:"line",
data:{
labels:["start"],
datasets:[{
label:"Vault USD",
data:[value]
}]
}
})

}else{

chart.data.labels.push("update")
chart.data.datasets[0].data.push(value)
chart.update()

}

}



async function loadInheritanceTimer(){

const req=await contract.inheritanceRequestTime()

if(req==0){

document.getElementById("inheritTimer").innerText="Not started"

return

}

const target=req+2592000

setInterval(()=>{

const now=Math.floor(Date.now()/1000)

let diff=target-now

if(diff<0)diff=0

const d=Math.floor(diff/86400)
const h=Math.floor((diff%86400)/3600)

document.getElementById("inheritTimer").innerText=

d+" days "+h+" hours"

},1000)

}



async function loadTransactions(){

const res=await fetch(

"https://api.bscscan.com/api?module=account&action=txlist&address="+contractAddress+"&sort=desc"

)

const data=await res.json()

const list=document.getElementById("txHistory")

list.innerHTML=""

if(!data.result)return

const txs=data.result.slice(0,5)

for(let tx of txs){

const li=document.createElement("li")

li.innerText=tx.hash.substring(0,10)+"... value "+ethers.formatEther(tx.value)

list.appendChild(li)

}

}



async function freezeVault(){

const tx=await contract.freezeVault()

await tx.wait()

}



async function unfreezeVault(){

const tx=await contract.unfreezeVault()

await tx.wait()

}



async function recoverOwner(){

const addr=document.getElementById("recoverOwner").value

const tx=await contract.recoverOwner(addr)

await tx.wait()

}

</script>

</body>

</html>
